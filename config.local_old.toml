# config.template.toml -- FAKE NUMBERS.
# Copy to config.local.toml and fill in your real data. config.local.toml is
# listed in .gitignore so it will not be committed if you use git.
# Requires Python 3.11+ (uses the built-in tomllib).

[household]
person1_birth = 1972-04-10        # you
person2_birth = 1972-02-26        # spouse (delete the line if single)
filing_status = "mfj"             # "mfj" or "single"

[model]
start_year = 2027                 # balances below are as of Jan 1 of this year
horizon_age = 95
horizon_person = "person1"        # "person1", "person2", or "younger"
nominal_return = 0.055            # all buckets, v0 uses a single rate
inflation = 0.025
tax_enabled = true                # set false to test the engine with no taxes
# Order money is drawn. Buckets: cash, taxable, trad, roth.
# Omit a bucket to never draw from it.
withdrawal_order = ["cash", "taxable", "trad", "roth"]

[balances]                        # combined for both spouses in v0
cash = 72233
taxable_value = 224378
taxable_basis = 150000            # cost basis of the taxable account
traditional = 1107046
roth = 45062

[spending]
target_monthly_real = 8000        # used for the Metric 2 and 3 balance paths
# Spending curve: [person1 age, multiplier]. Linear between points, flat outside.
# PLACEHOLDER shape (higher early, lower later) -- replace with your own.
curve = [[60, 1.05], [75, 1.00], [85, 0.85], [95, 0.85]]

# One-time purchases, paid from after-tax money, in start-year (real) dollars.
# Add as many [[purchases]] blocks as you like; delete these two if none.
[[purchases]]
year = 2030
amount_real = 40000
label = "New car"

[[purchases]]
year = 2035
amount_real = 25000
label = "Big trip"
